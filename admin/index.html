<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Admin</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #11161a;
        color: #e7ecee;
      }

      .admin-note {
        max-width: 760px;
        margin: 24px auto;
        padding: 16px 18px;
        border: 1px solid rgba(231, 236, 238, 0.12);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        line-height: 1.6;
      }

      .admin-note[hidden] {
        display: none;
      }

      .admin-note code {
        color: #b7c4bc;
      }
    </style>
  </head>
  <body>
    <div class="admin-note" id="admin-note" hidden>
      This admin panel is meant to open from the hosted site, not from a local <code>file:///</code> path. After the site is pushed, open <code>/protfolio/admin/</code> on GitHub Pages to get the login and content editor.
    </div>

    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('admin-note').hidden = false;
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
